<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#006633"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Escudo -->
  <path d="M100 12 L172 45 C172 118 100 182 100 182 C100 182 28 118 28 45 Z" 
        fill="#070e20" stroke="url(#shieldGrad)" stroke-width="6" filter="url(#neonGlow)"/>

  <!-- Borde interior dorado -->
  <path d="M100 24 L158 52 C158 112 100 166 100 166 C100 166 42 112 42 52 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8"/>

  <!-- Balón de fútbol geométrico central -->
  <circle cx="100" cy="92" r="34" fill="#ffffff" stroke="#070e20" stroke-width="3"/>
  <polygon points="100,75 116,87 110,105 90,105 84,87" fill="#070e20"/>
  <line x1="100" y1="75" x2="100" y2="58" stroke="#070e20" stroke-width="2.5"/>
  <line x1="116" y1="87" x2="132" y2="82" stroke="#070e20" stroke-width="2.5"/>
  <line x1="110" y1="105" x2="122" y2="120" stroke="#070e20" stroke-width="2.5"/>
  <line x1="90" y1="105" x2="78" y2="120" stroke="#070e20" stroke-width="2.5"/>
  <line x1="84" y1="87" x2="68" y2="82" stroke="#070e20" stroke-width="2.5"/>

  <!-- Estrellas doradas superiores -->
  <polygon points="100,28 103,36 111,36 105,41 107,49 100,44 93,49 95,41 89,36 97,36" fill="url(#goldGrad)"/>
  <polygon points="76,34 78,40 84,40 80,44 81,50 76,46 71,50 72,44 68,40 74,40" fill="url(#goldGrad)"/>
  <polygon points="124,34 126,40 132,40 128,44 129,50 124,46 119,50 120,44 116,40 122,40" fill="url(#goldGrad)"/>

  <!-- Texto ZONA FÚTBOL -->
  <rect x="36" y="132" width="128" height="26" rx="6" fill="#00e676"/>
  <text x="100" y="150" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900" fill="#050811" text-anchor="middle" letter-spacing="2">
    ZONA FÚTBOL
  </text>
</svg>
